id: docker
name: Docker + Compose
description: Official Docker CE, Compose plugin, and docker-compose binary
steps:
  - name: Wait for apt (stop racing unattended-upgrades)
    commands:
      - |
        export DEBIAN_FRONTEND=noninteractive
        # Soft-stop automatic upgrades so they don't re-grab the lock mid-install.
        systemctl stop unattended-upgrades.service 2>/dev/null || true
        systemctl stop apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
        systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
        echo "apt services paused for install"
  - name: Remove conflicting packages
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do apt-get remove -y $pkg 2>/dev/null || true; done"
  - name: Add Docker apt repository
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "apt-get update -y"
      - "apt-get install -y ca-certificates curl gnupg"
      - "install -m 0755 -d /etc/apt/keyrings"
      - "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg"
      - "chmod a+r /etc/apt/keyrings/docker.gpg"
      - |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
      - "apt-get update -y"
  - name: Install Docker Engine
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin"
      - "systemctl enable --now docker"
  - name: Install docker-compose binary
    commands:
      - |
        curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
      - "chmod +x /usr/local/bin/docker-compose"
      - "docker --version"
      - "docker compose version || true"
      - "docker-compose --version"
