id: nodejs
name: Node.js 20
description: Install Node.js 20.x from NodeSource
steps:
  - name: Install NodeSource and Node.js
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "apt-get update -y"
      - "apt-get install -y curl ca-certificates gnupg"
      - "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -"
      - "apt-get install -y nodejs"
      - "node --version"
      - "npm --version"
      - "which node npm"
uninstall_steps:
  - name: Remove Node.js and NodeSource repo
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "apt-get remove -y nodejs || true"
      - "apt-get autoremove -y || true"
      - |
        rm -f /etc/apt/sources.list.d/nodesource.list \
              /etc/apt/sources.list.d/nodesource.list.save \
              /usr/share/keyrings/nodesource.gpg \
              /etc/apt/keyrings/nodesource.gpg \
              /etc/apt/keyrings/nodesource-repo.gpg
        echo "Node.js and NodeSource repo removed."
