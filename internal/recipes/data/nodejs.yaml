id: nodejs
name: Node.js 20
description: Install Node.js 20.x from NodeSource
steps:
  - name: Install NodeSource and Node.js
    commands:
      - "export DEBIAN_FRONTEND=noninteractive"
      - "apt-get update -y"
      - "apt-get install -y curl ca-certificates gnupg"
      - "curl -fsSL https://deb.nodesource.com/setup_20.x | bash -"
      - "apt-get install -y nodejs"
      - "node --version"
      - "npm --version"
      - "which node npm"
