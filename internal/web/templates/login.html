{{define "login"}}
{{template "head" .}}
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-400">⚡ XManager</h1>
      {{if .NodeMode}}
      <p class="text-gray-500 mt-1 text-sm">Sign in to this server's metrics panel</p>
      {{else}}
      <p class="text-gray-500 mt-1 text-sm">Sign in to your control panel</p>
      {{end}}
    </div>
    <div class="bg-gray-900 rounded-2xl border border-gray-800 p-8 shadow-2xl">
      {{if .Flash}}
      <div class="mb-4 p-3 bg-red-900/40 border border-red-700/60 rounded-lg text-red-300 text-sm">{{.Flash}}</div>
      {{end}}
      <form action="/login" method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Username</label>
          <input type="text" name="username" required autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
          <input type="password" name="password" required
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition-colors">
          Sign in
        </button>
      </form>
    </div>
  </div>
{{template "foot" .}}
{{end}}
