{{define "login_2fa"}}
{{template "head" .}}
<div class="xm-auth">
  <div class="xm-auth-lede">
    <div>
      <p class="xm-brand-sub">XManager</p>
      <h1>Authenticator</h1>
      <p>Enter the 6-digit code from Google Authenticator or a similar app.</p>
    </div>
    <p class="xm-auth-foot">Or use a recovery code</p>
  </div>
  <div class="xm-auth-form">
    {{if .Flash}}
    <div class="xm-flash xm-flash-error">{{.Flash}}</div>
    {{end}}
    <form action="/login/2fa" method="post" class="space-y-4">
      <div>
        <label for="code">Authenticator code</label>
        <input id="code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" autofocus class="xm-mono">
      </div>
      <div>
        <label for="recovery">Recovery code <span class="text-muted">(optional)</span></label>
        <input id="recovery" type="text" name="recovery" autocomplete="off" class="xm-mono">
      </div>
      <button type="submit" class="xm-btn xm-btn-primary w-full">Verify</button>
    </form>
    <p><a href="/login">Back to sign in</a></p>
  </div>
</div>
{{template "foot" .}}
{{end}}
