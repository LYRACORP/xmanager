{{define "login_2fa"}}
{{template "head" .}}
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="xm-brand-mark mx-auto mb-3" style="width:2.5rem;height:2.5rem;font-size:1.1rem">X</div>
      <h1 class="text-2xl font-bold tracking-tight">Authenticator</h1>
      <p class="text-panel-muted mt-1 text-sm">Enter the 6-digit code from Google Authenticator or a similar app</p>
    </div>
    <div class="xm-card p-8">
      {{if .Flash}}
      <div class="mb-4 p-3 bg-red-900/40 border border-red-700/60 rounded-lg text-red-300 text-sm">{{.Flash}}</div>
      {{end}}
      <form action="/login/2fa" method="post" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-panel-muted mb-1">Authenticator code</label>
          <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" autofocus
            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-2.5 text-gray-100 font-mono tracking-widest
                   focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
        </div>
        <div>
          <label class="block text-sm font-medium text-panel-muted mb-1">Recovery code <span class="text-gray-600">(optional)</span></label>
          <input type="text" name="recovery" autocomplete="off"
            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-2.5 text-gray-100 font-mono
                   focus:outline-none focus:ring-2 focus:ring-emerald-500/40">
        </div>
        <button type="submit" class="xm-btn xm-btn-primary w-full justify-center py-2.5">Verify</button>
      </form>
      <p class="text-center mt-4"><a href="/login" class="text-xs text-panel-muted hover:text-gray-300">Back to sign in</a></p>
    </div>
  </div>
</div>
{{template "foot" .}}
{{end}}
