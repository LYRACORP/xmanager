{{define "panel_goodbye"}}
{{template "head" .}}
<div class="xm-auth">
  <div class="xm-auth-lede">
    <div>
      <p class="xm-brand-sub">XManager</p>
      <h1>{{.Title}}</h1>
      {{if .Flash}}<p>{{.Flash}}</p>{{end}}

    <p class="xm-auth-foot">Panel session ended</p>

  <div class="xm-auth-form">
    <p class="text-muted">This node panel is no longer serving the UI.</p>
  </div>
</div>
{{template "foot" .}}
{{end}}
