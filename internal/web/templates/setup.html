{{define "setup"}}
{{template "head" .}}
<div class="xm-auth">
  <div class="xm-auth-lede">
    <div>
      <p class="xm-brand-sub">XManager</p>
      <h1>Create admin</h1>
      <p>No users exist yet. This account owns the panel on first boot.</p>
    </div>
    <p class="xm-auth-foot">First-run setup</p>
  </div>
  <div class="xm-auth-form">
    {{if .Flash}}
    <div class="xm-flash xm-flash-error">{{.Flash}}</div>
    {{end}}
    <div class="xm-flash xm-flash-ok">Set the admin username and password below.</div>
    <form action="/setup" method="post" class="space-y-4">
      <div>
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required autofocus autocomplete="username">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="new-password">
      </div>
      <button type="submit" class="xm-btn xm-btn-primary w-full">Create admin</button>
    </form>
  </div>
</div>
{{template "foot" .}}
{{end}}
